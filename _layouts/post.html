---
layout: default
---

<article class="post h-entry" itemscope itemtype="https://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="page-date">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%B %d, %Y" }}</time>
      {% if page.author %}
      <span class="post-author" itemprop="author">· {{ page.author }}</span>
      {% endif %}
      {% if page.ai_assisted %}
      <span class="ai-badge" title="KI-gestützt geschrieben, von lxndrJ kuratiert">⚡ KI-gestützt</span>
      {% endif %}
    </p>
  </header>

  {% if page.image %}
  <figure class="hero-image" itemprop="image">
    <img src="{{ page.image }}"
         alt="{{ page.image_alt | default: '' }}"
         width="1200" height="675"
         fetchpriority="high"
         loading="eager" />
    {% if page.image_credit %}
    <figcaption class="image-credit">
      {{ page.image_credit }}
    </figcaption>
    {% endif %}
  </figure>
  {% endif %}

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

</article>
